# State-digest coverage allowlist (TCK-20261103-STATE-DIGEST-MAY-OMIT-FIELDS-THAT-DECISIONS-READ, item 1).
# Every field path reachable from AuthoritativeState that a type-correct change does NOT move the canonical digest for is a row here (GAP or EXCLUDE), with its reason.
# GAP = anything outside observability reads it across a tick: a recorded known gap, not a pass. EXCLUDE needs (i) rebuilt from hashed state (site cited), (ii) run setup
# recorded in the manifest, or (iii) write-only (tag no_reader, grep cited). A path under an unhashed container is covered by the container's row.
# A new unhashed field fails the test; a row whose field is now hashed, or gone, fails it too. Reasons are ruled by rpg-planner (2026-11-15).
