apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    url: http://prometheus:9090
    access: proxy
    isDefault: true
    editable: false
    uid: prometheus

  - name: Loki
    type: loki
    url: http://loki:3100
    access: proxy
    editable: false
    uid: loki
    jsonData:
      derivedFields:
        # The backend prints ` trace_id=<32 hex>` on lines logged inside a span (src/logging/formatter.py, plain format). The link opens the trace in Tempo.
        # Add the JSON regex "trace_id":\s*"(\w+)" only if the container switches to --json-logs.
        - name: trace_id
          matcherRegex: 'trace_id=(\w+)'
          datasourceUid: tempo
          url: '$${__value.raw}'

  - name: Tempo
    type: tempo
    url: http://tempo:3200
    access: proxy
    editable: false
    uid: tempo
    jsonData:
      tracesToLogsV2:
        # Loki streams carry a `container` label (alloy discovery.relabel); filter on the backend container and the trace id.
        datasourceUid: loki
        customQuery: true
        query: '{container=~".*backend.*"} |= "$${__trace.traceId}"'
      tracesToMetrics:
        datasourceUid: prometheus
