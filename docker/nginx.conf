map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen       8080;
    server_name  localhost;

    charset utf-8;

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # nginx is the only source of the API key (TCK-20261112-COMPOSE-STACK-HAS-NO-API-KEY): this file is rendered at container start from the
        # FRONTEND_API_KEY environment variable (docker/nginx-api-key.conf.template) and holds one line, `proxy_set_header X-API-Key "<key>";`. An empty
        # key sends no header at all. The file lives only in the container's /tmp (the key is never in the image). An explicit include: if the file is
        # missing, nginx refuses to start instead of silently sending nothing.
        include /tmp/api-key.conf;

        # Support for SSE and WebSockets
        chunked_transfer_encoding off;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
