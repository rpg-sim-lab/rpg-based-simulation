name: Deploy Docs to GitHub Pages

on:
  push:
    branches: [main]
    # Why a filter: a merge that changes nothing the site is built from must not redeploy it
    # (TCK-20260916-REENABLE-DOCS-PAGES-PUBLISHING). The build is `cd website && npm run build`; its inputs are
    # website/** (the Docusaurus site and its generator) and what website/scripts/generate_wiki.py reads from outside it:
    # docs/world_rules/**, data/content/**, and four files under registries/. Add a path here when that script reads a new one.
    paths:
      - 'website/**'
      - '!website/node_modules/**'
      - 'docs/world_rules/**'
      - 'data/content/**'
      - 'registries/mechanisms.yaml'
      - 'registries/system_registry.jsonl'
      - 'registries/mechanism_causal_edges.yaml'
      - 'registries/world_glossary.jsonl'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; don't cancel in-progress so we don't
# leave a half-deployed site.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: cd website && npm ci

      - name: Build
        env:
          DOCS_URL: https://rpg-sim-lab.github.io
          DOCS_BASE_URL: /rpg-based-simulation/
          NODE_OPTIONS: --max-old-space-size=8192
        run: cd website && npm run build

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: website/build

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
