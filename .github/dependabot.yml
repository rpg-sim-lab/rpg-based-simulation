# Dependabot version updates (TCK-20261014-DEPENDABOT-AND-BASE-IMAGE-PINS, TCK-20261014-DEPENDABOT-GROUPED-MAJORS-MONTHLY).
# Monthly. Each ecosystem opens at most two PRs a month: one for major updates, one for minor/patch. We stay current on majors.
# Review routing by the file a PR changes (labels below): uv.lock and frontend/** -> rpg; test.yml actions -> testing;
# website/** -> lead (platform triages); everything else -> platform.
version: 2
updates:
  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    labels: [dependencies, platform]
    # Stay on an even (LTS) Node line: do not propose Node 25+ (Node 24 LTS is the owner's choice, 2026-10-14).
    # Widen this deliberately when the next even LTS line matures.
    ignore:
      - dependency-name: node
        versions: [">=25"]
      # Python 3.14+ waits for rpg's dependency window: CI, uv.lock and setup-uv are on 3.13 and the image
      # check "Image runs the CI Python" fails on a different line. 3.13.x patch updates still come through.
      # Widen this when rpg moves CI and the lockfile to the next line.
      - dependency-name: python
        versions: [">=3.14"]
      # The uv image pin moves together with test.yml's setup-uv `version:` input, which Dependabot cannot bump
      # (see the header of docker/backend.Dockerfile). Bump both by hand. The name is the one Dependabot
      # reported for ghcr.io/astral-sh/uv in #576's update metadata.
      - dependency-name: astral-sh/uv
    groups:
      docker-major:
        update-types: [major]
      docker-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    labels: [dependencies, platform]
    groups:
      compose-major:
        update-types: [major]
      compose-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    labels: [dependencies, platform]
    groups:
      actions-major:
        update-types: [major]
      actions-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    labels: [dependencies, rpg]
    groups:
      npm-major:
        update-types: [major]
      npm-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /website
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    labels: [dependencies, platform]
    groups:
      npm-major:
        update-types: [major]
      npm-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    labels: [dependencies, rpg]
    # The knowledge-stack pins in requirements-knowledge.txt (torch, graphifyy, headroom-ai) are not bumped by
    # Dependabot (owner decision on #882, option A, #715 6812820923): the grouped PR rewrote torch==2.13.0+cpu to
    # 2.15.0 (dropping +cpu) and headroom-ai needs mcp 2.x. agent-working bumps them by hand, with its tests.
    # No `versions`, so every version update for these names is skipped. torch in uv.lock moves the same way.
    ignore:
      - dependency-name: torch
      - dependency-name: graphifyy
      - dependency-name: headroom-ai
      # mcp majors wait for the 2.x migration (TCK-20261119-MCP-2X-MIGRATION-VISUAL-ASSETS-SEARCH-MCP-HEADROOM-AI):
      # 2.x renames FastMCP, which breaks visual_assets/drawing and tools/search_mcp (closed #813). Minor and patch
      # updates still come through. The migration PR removes this entry.
      - dependency-name: mcp
        update-types: ["version-update:semver-major"]
      # complexipy majors wait for a code-health re-baseline under its own ruling (TCK-20261119-DEPENDABOT-IGNORES-COMPLEXIPY-MAJORS-AND-SENTENCE-TRANSFORMERS):
      # Dependabot #974's 8 -> 9 bump produced 60 new/worse violations on the code-health ratchet. Minor and patch updates still come through.
      - dependency-name: complexipy
        update-types: ["version-update:semver-major"]
      # sentence-transformers is knowledge stack, bumped by hand with torch, graphifyy and headroom-ai (owner decision on #882, option A):
      # a version change can change the embeddings and so the search index. No `versions`, so every version update is skipped.
      # uv.lock moves with the hand bump.
      - dependency-name: sentence-transformers
    groups:
      uv-major:
        update-types: [major]
      uv-minor-patch:
        update-types: [minor, patch]
